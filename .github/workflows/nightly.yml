name: nightly

# SPEC-002 REQ-6. Per-commit CI proves the code you wrote is correct. Nightly proves the code you
# did NOT write is still correct — and a template with no users has no other mechanism for noticing.
#
# Two jobs, because they catch different things and one cannot do the other's work.

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

# The default token is broad; every job here only READS the repository. `codeql` re-grants itself
# `security-events: write` per job, which is the shape GitHub documents — narrow at the top, widen
# where a job genuinely needs it. Added 2026-09-10 after a derived rule started asking which
# workflows spend a credential and found this one interpolating `secrets.GITHUB_TOKEN` with no
# declaration at all (F-76).
permissions:
  contents: read

jobs:
  # What only TIME changes: a new runner image, a Node patch, a `latest` Supabase CLI, a rebuilt
  # Docker image, and the freshness stamps, which expire on a date rather than on a commit. This is
  # also the clean-clone build — the only thing that catches the rot no dependency check can see,
  # that the project no longer installs at all.
  clean-clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # Full history, for the same reason check.yml carries it — and this job did not, which is
        # why the nightly has been red since 2026-09-09. The review-record rule verifies that each
        # record names a commit that EXISTS, and a default checkout fetches one, so every record
        # cites a sha this clone has never heard of. The gate's own message names the fix: "Set
        # `fetch-depth: 0` on the checkout step for any job that runs this gate."
        #
        # The lesson was learned at run 34261942642, written into check.yml's checkout, and not
        # applied here. A rule recorded in one file and not the other is F-75's shape at the
        # workflow layer, and `check-workflow.test.mts` now asserts it across every job of every
        # workflow rather than one job of one file.
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 26, cache: npm }
      # postinstall scripts are a live supply-chain attack vector (ADR-007).
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python3 -m venv .venv && ./.venv/bin/pip install -r requirements.txt
      - uses: supabase/setup-cli@v1
        with:
          # PINNED, and it has to be. `supabase gen types` is a code GENERATOR, so its output is a
          # function of its own version as well as of the schema: 2.117.0 parenthesizes conditional
          # types that 2.109.0 leaves bare. `check-generated` compares the committed artifact
          # byte-for-byte, so with `version: latest` it reported "the schema has changed since it was
          # generated" on a run where the schema had not changed — twice, on 2026-09-08, costing two
          # diagnostic cycles before the artifact upload showed a twenty-line formatting diff.
          #
          # A generated artifact can only be compared against a pinned generator. Upgrading this is a
          # deliberate act: bump it, regenerate, and commit the diff in the SAME change. DEF-016
          # carries the review date so the pin cannot quietly become the old version nobody chose.
          version: 2.109.0
      - run: supabase start
      # `supabase gen types --local` runs postgres-meta in a container it pulls on demand, and
      # public.ecr.aws rate-limits it: two runs on 2026-09-08 failed with `toomanyrequests: Rate
      # exceeded` AFTER every gate had passed. Pull it up front, with backoff, so a registry
      # throttle cannot masquerade as a broken stack. The tag tracks the pinned CLI above; both
      # move together or neither does.
      - name: pre-pull postgres-meta (registry throttling, not a code path)
        run: |
          for i in 1 2 3 4 5; do
            docker pull public.ecr.aws/supabase/postgres-meta:v0.96.1 && exit 0
            echo "pull attempt $i failed; backing off"
            sleep $((i * 15))
          done
          echo "could not pull postgres-meta after five attempts"
          exit 1
      # --strict: a degraded gate is a rule that did not run. On a laptop that can be a
      # hotel network; on a runner with a network it is news, so it fails here.
      - run: npm run check -- --strict
      # The access matrix is evidence, so it is published from the run that produced it.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: access-matrix-nightly
          path: docs/ACCESS-MATRIX.md

  # The caret range REQ-6 actually names, and the reason this job exists separately: `npm ci`
  # installs the lockfile exactly, so it can NEVER surface a dependency that changed behavior inside
  # a range we already accept. Only a fresh resolution can. It runs without the database because the
  # question is "does the new resolution still behave", not "is the schema correct" — and it is
  # `continue-on-error` deliberately: a range moving under us is news, not a broken build, and a
  # nightly that cries wolf about somebody else's release gets muted within a week.
  range-drift:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 26 }
      - run: npm install --no-save --no-audit --ignore-scripts
      - run: git --no-pager diff --stat -- package-lock.json || true
      # `.next/` is gitignored, so `PageProps` — which lives in `.next/types/routes.d.ts` — does not
      # exist on a clean checkout. Without this, `tsc` fails with `Cannot find name 'PageProps'`, and
      # because a failed step halts the job, `npm test` below is skipped.
      #
      # This step was missing from the job's creation and cost nothing until SPEC-004 put `PageProps`
      # into `src/` (ce01626). The two nightlies before that commit ran `npm test` and passed; the
      # first one after it did not. **A CI job that omits a build step passes for exactly as long as
      # no feature needs that step**, and the commit that breaks it is not the commit that touches
      # it — which is why nothing in SPEC-004's review could have caught this (F-76).
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
