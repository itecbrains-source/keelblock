name: check

on:
  push: { branches: [main] }
  pull_request:

# The scheduled clean-clone build lives in nightly.yml. It was weekly here, which caught time-based
# rot up to seven days late and did not match the claim in PRODUCT.md that the proof runs every night.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # Full history. The review-record rule verifies that each record names a commit that exists
        # and that the numbering matches real ancestry — and the default checkout fetches ONE commit,
        # so every record cites a sha this clone has never heard of. Run 34261942642 failed exactly
        # that way. A gate that can only pass on a shallow clone by being switched off is not a gate.
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v5
        with: { node-version: 26, cache: npm }
      # postinstall scripts are a live supply-chain attack vector (ADR-007).
      - run: npm ci --ignore-scripts

      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python3 -m venv .venv && ./.venv/bin/pip install -r requirements.txt

      - uses: supabase/setup-cli@v1
        with:
          # PINNED, and it has to be. `supabase gen types` is a code GENERATOR, so its output is a
          # function of its own version as well as of the schema: 2.117.0 parenthesizes conditional
          # types that 2.109.0 leaves bare. `check-generated` compares the committed artifact
          # byte-for-byte, so with `version: latest` it reported "the schema has changed since it was
          # generated" on a run where the schema had not changed — twice, on 2026-09-08, costing two
          # diagnostic cycles before the artifact upload showed a twenty-line formatting diff.
          #
          # A generated artifact can only be compared against a pinned generator. Upgrading this is a
          # deliberate act: bump it, regenerate, and commit the diff in the SAME change. DEF-016
          # carries the review date so the pin cannot quietly become the old version nobody chose.
          version: 2.109.0
      - run: supabase start
      # `supabase gen types --local` runs postgres-meta in a container it pulls on demand, and
      # public.ecr.aws rate-limits it: two runs on 2026-09-08 failed with `toomanyrequests: Rate
      # exceeded` AFTER every gate had passed. Pull it up front, with backoff, so a registry
      # throttle cannot masquerade as a broken stack. The tag tracks the pinned CLI above; both
      # move together or neither does.
      - name: pre-pull postgres-meta (registry throttling, not a code path)
        run: |
          for i in 1 2 3 4 5; do
            docker pull public.ecr.aws/supabase/postgres-meta:v0.96.1 && exit 0
            echo "pull attempt $i failed; backing off"
            sleep $((i * 15))
          done
          echo "could not pull postgres-meta after five attempts"
          exit 1

      # Runs every gate and reports every failure, not just the first.
      # --strict: a degraded gate is a rule that did not run. On a laptop that can be a
      # hotel network; on a runner with a network it is news, so it fails here.
      - run: npm run check -- --strict

      # What THIS run generated, not what the repository committed.
      #
      # The previous version uploaded docs/ACCESS-MATRIX.md straight from the checkout and called it
      # "published from the run that produced it" -- but `check` runs the generator in --check mode,
      # which compares and never writes, so the artifact was the committed copy either way. It could
      # not have shown a disagreement, which is the only thing anyone would download it for.
      # The journey layer — SPEC-002's fourth test layer, DEF-002.
      #
      # In `check`, on every push, and the browser install is the cost of that. It is ~15s of run
      # time against a suite that takes seconds, and the alternative — nightly only — was rejected
      # for a specific reason: F-38 is a defect that three green unit tests could not see, and a
      # nightly gate finds that class the morning AFTER it is pushed. The whole argument for this
      # layer is that it sees what the others cannot, which is worth nothing a day late.
      #
      # `--with-deps` is omitted: the runner image already carries the shared libraries, and adding
      # it costs a minute of apt for nothing.
      - run: npx playwright install chromium
      - name: journey layer
        # Keys read from the running stack rather than written down. They are the local demo keys —
        # identical on every machine and not secret — but hardcoding them here would be a second
        # copy that goes stale when the CLI changes them, and a reader could not tell that from a
        # leaked credential.
        run: |
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          KEELBLOCK_MAILPIT_URL="$INBUCKET_URL" \
          npm run journey
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: journey-traces
          path: test-results/
          retention-days: 7

      - name: capture what this run generated
        if: always()
        run: |
          supabase gen types typescript --local > /tmp/ci-database.types.ts || true
          diff src/lib/db/database.types.ts /tmp/ci-database.types.ts > /tmp/types.diff || true
          npm run access-matrix || true
          cp docs/ACCESS-MATRIX.md /tmp/ci-ACCESS-MATRIX.md || true
          # The battlecard is the third generated artifact. If it goes stale in CI the diff is the
          # only thing worth downloading, and a diagnostics step that knows about two of three
          # artifacts is the shape of every gap this repository keeps finding.
          node scripts/battlecard.mjs || true
          cp docs/content/BATTLECARD.md /tmp/ci-BATTLECARD.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-by-this-run
          path: |
            /tmp/ci-database.types.ts
            /tmp/types.diff
            /tmp/ci-ACCESS-MATRIX.md
            /tmp/ci-BATTLECARD.md

  # Dependency vulnerabilities. Built in, no dependency of its own, and fails only on high severity —
  # a gate that fires on every transitive `low` gets ignored within a week.
  # B-10 · the upgrade path, executed rather than documented.
  #
  # PRODUCT.md calls upgradability the deepest structural failure in this category, and the two paid
  # kits answer it with a git remote — MakerKit's page does not mention conflicts, and supastarter's
  # says out loud that updating "will become harder" the more you use the product. A claim to have
  # solved that is worth nothing as prose, so this scaffolds a synthetic buyer at the previous tag,
  # lets them diverge, applies the upgrade, and runs TODAY's suite against the result.
  #
  # The buyer here is synthetic: keelblock has no users and no deployment (DEF-001). What this proves is
  # that the path works, not that anybody has walked it.
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # Tags, and full history: the job's first act is to find the previous release.
        with: { fetch-depth: 0 }

      - uses: supabase/setup-cli@v1
        with: { version: 2.109.0 }

      - name: scaffold a buyer at the previous tag, and let them diverge
        run: |
          TAG="$(git tag --sort=-creatordate | head -1)"
          if [ -z "$TAG" ]; then echo "no release tag yet — nothing to upgrade FROM"; exit 1; fi
          echo "scaffolding at $TAG"
          git worktree add /tmp/scaffold "$TAG"
          # The buyer's own work, months after they cloned. The migration is deliberately dated AFTER
          # the fix they are about to receive, because that is the ordinary case and it is what makes
          # `supabase migration up` refuse (F-45).
          cp .github/workflows/fixtures/buyer_customer_note.sql \
             /tmp/scaffold/supabase/migrations/20260910090000_buyer_customer_note.sql

      - name: the buyer's stack, at their own schema
        working-directory: /tmp/scaffold
        run: supabase start && supabase db reset

      - name: apply the upgrade
        working-directory: /tmp/scaffold
        # The buyer's product code is never touched; only upstream-owned paths are taken. The script
        # is the documented path, so this job and the documentation cannot drift.
        run: node "$GITHUB_WORKSPACE/scripts/upgrade.mjs" "$GITHUB_SHA" /tmp/scaffold

      - name: TODAY's suite, against the upgraded project
        working-directory: /tmp/scaffold
        run: supabase test db

      - name: the buyer's own code survived
        working-directory: /tmp/scaffold
        run: |
          git diff --quiet HEAD -- src messages \
            || { echo "the upgrade edited files the buyer owns"; git diff --stat HEAD -- src messages; exit 1; }

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 26, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high

  # Data-flow and injection classes no gate in this repository looks for. Free on public
  # repositories, GitHub-native, and it costs nothing to keep.
  codeql:
    runs-on: ubuntu-latest
    permissions: { security-events: write, contents: read }
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript, queries: security-extended }
      - uses: github/codeql-action/analyze@v3

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # Full history: a secret committed and later removed is still a live compromise (ADR-007).
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
