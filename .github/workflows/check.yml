name: check

on:
  push: { branches: [main] }
  pull_request:

# The scheduled clean-clone build lives in nightly.yml. It was weekly here, which caught time-based
# rot up to seven days late and did not match the claim in PRODUCT.md that the proof runs every night.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with: { node-version: 26, cache: npm }
      # postinstall scripts are a live supply-chain attack vector (ADR-007).
      - run: npm ci --ignore-scripts

      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python3 -m venv .venv && ./.venv/bin/pip install -r requirements.txt

      - uses: supabase/setup-cli@v1
        with:
          # PINNED, and it has to be. `supabase gen types` is a code GENERATOR, so its output is a
          # function of its own version as well as of the schema: 2.117.0 parenthesizes conditional
          # types that 2.109.0 leaves bare. `check-generated` compares the committed artifact
          # byte-for-byte, so with `version: latest` it reported "the schema has changed since it was
          # generated" on a run where the schema had not changed — twice, on 2026-09-08, costing two
          # diagnostic cycles before the artifact upload showed a twenty-line formatting diff.
          #
          # A generated artifact can only be compared against a pinned generator. Upgrading this is a
          # deliberate act: bump it, regenerate, and commit the diff in the SAME change. DEF-016
          # carries the review date so the pin cannot quietly become the old version nobody chose.
          version: 2.109.0
      - run: supabase start
      # `supabase gen types --local` runs postgres-meta in a container it pulls on demand, and
      # public.ecr.aws rate-limits it: two runs on 2026-09-08 failed with `toomanyrequests: Rate
      # exceeded` AFTER every gate had passed. Pull it up front, with backoff, so a registry
      # throttle cannot masquerade as a broken stack. The tag tracks the pinned CLI above; both
      # move together or neither does.
      - name: pre-pull postgres-meta (registry throttling, not a code path)
        run: |
          for i in 1 2 3 4 5; do
            docker pull public.ecr.aws/supabase/postgres-meta:v0.96.1 && exit 0
            echo "pull attempt $i failed; backing off"
            sleep $((i * 15))
          done
          echo "could not pull postgres-meta after five attempts"
          exit 1

      # Runs every gate and reports every failure, not just the first.
      # --strict: a degraded gate is a rule that did not run. On a laptop that can be a
      # hotel network; on a runner with a network it is news, so it fails here.
      - run: npm run check -- --strict

      # What THIS run generated, not what the repository committed.
      #
      # The previous version uploaded docs/ACCESS-MATRIX.md straight from the checkout and called it
      # "published from the run that produced it" -- but `check` runs the generator in --check mode,
      # which compares and never writes, so the artifact was the committed copy either way. It could
      # not have shown a disagreement, which is the only thing anyone would download it for.
      - name: capture what this run generated
        if: always()
        run: |
          supabase gen types typescript --local > /tmp/ci-database.types.ts || true
          diff src/lib/db/database.types.ts /tmp/ci-database.types.ts > /tmp/types.diff || true
          npm run access-matrix || true
          cp docs/ACCESS-MATRIX.md /tmp/ci-ACCESS-MATRIX.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-by-this-run
          path: |
            /tmp/ci-database.types.ts
            /tmp/types.diff
            /tmp/ci-ACCESS-MATRIX.md

  # Dependency vulnerabilities. Built in, no dependency of its own, and fails only on high severity —
  # a gate that fires on every transitive `low` gets ignored within a week.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 26, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high

  # Data-flow and injection classes no gate in this repository looks for. Free on public
  # repositories, GitHub-native, and it costs nothing to keep.
  codeql:
    runs-on: ubuntu-latest
    permissions: { security-events: write, contents: read }
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript, queries: security-extended }
      - uses: github/codeql-action/analyze@v3

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # Full history: a secret committed and later removed is still a live compromise (ADR-007).
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
